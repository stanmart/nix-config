name: Renovate

on:
  schedule:
    # Weekly on Monday, early morning UTC. Container bumps follow this cadence;
    # lockFileMaintenance in renovate.json5 narrows itself to the first run of the month.
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      logLevel:
        description: Renovate log level
        required: false
        default: info
        type: choice
        options: [info, debug]

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run Renovate
        uses: renovatebot/github-action@43b963bf5dd5e57f1f95c59765a018d782870211 # v46.3.11
        with:
          configurationFile: renovate.json5
          token: ${{ secrets.GH_TOKEN_FOR_UPDATES }}
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_PLATFORM: github
